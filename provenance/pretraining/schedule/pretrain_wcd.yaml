name: "pretrain_wcd"

# Total steps or epochs for this stage
epochs: 100

warmup_epochs: 5
cooldown_epochs: 10
base_lr: 1e-4
min_lr: 1e-6
weight_decay: 0.05

# Optimization
optimizer: "adamw"
betas: [0.9, 0.95]

# Schedule type
type: "warmup_constant_decay" # linear warmup, constant hold, cosine decay
